<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards - Frente e Verso Alinhados</title>
    <style>
      :root {
        --bg-color: #dfe6e9;
        --card-bg: #ffffff;
        --text-main: #111;
        --text-sub: #444;

        /* Cores dos níveis */
        --color-easy: #d1e7dd;
        --border-easy: #0f5132;

        --color-medium: #fff3cd;
        --border-medium: #664d03;
        --text-medium: #664d03;

        --color-hard: #f8d7da;
        --border-hard: #842029;

        /* Cores do Verso (Dark Theme Gupy) */
        --card-back-bg: #0d1117;
        --card-back-color: #ffffff;
      }

      @page {
        size: A4;
        margin: 5mm;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg-color);
        color: var(--text-main);
      }

      /* Container fixo de grade para manter o alinhamento perfeito na A4 */
      .page {
        width: 200mm;
        height: 287mm;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 63.5mm);
        grid-template-rows: repeat(3, 88.9mm);
        gap: 4mm;
        align-content: center;
        justify-content: center;
        page-break-after: always;
        break-after: page;
        position: relative;
      }

      .card {
        width: 63.5mm;
        height: 88.9mm;
        background: var(--card-bg);
        border: 2px solid #ccc;
        border-radius: 4mm;
        padding: 3mm;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        word-wrap: break-word;
        word-break: break-word;
        hyphens: auto;
      }

      /* Estilo do Verso da Carta */
      .card.card-back-side {
        background: var(--card-back-bg);
        color: var(--card-back-color);
        border-color: #0f1418;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0;
      }

      /* Bordas da Frente por Dificuldade */
      .card.easy {
        border-color: var(--border-easy);
        border-left-width: 6mm;
      }
      .card.intermediate {
        border-color: var(--border-medium);
        border-left-width: 6mm;
      }
      .card.hard {
        border-color: var(--border-hard);
        border-left-width: 6mm;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5mm;
      }
      .id-label {
        font-size: 8pt;
        font-weight: bold;
        color: var(--text-sub);
      }
      .difficulty {
        padding: 0.6mm 1.8mm;
        border-radius: 2mm;
        font-size: 7pt;
        font-weight: bold;
        text-transform: uppercase;
      }
      .badge-easy {
        background: var(--color-easy);
        color: var(--border-easy);
      }
      .badge-intermediate {
        background: var(--color-medium);
        color: var(--text-medium);
      }
      .badge-hard {
        background: var(--color-hard);
        color: var(--border-hard);
      }

      .front-pt {
        color: var(--text-sub);
        font-style: italic;
        margin-bottom: 1mm;
      }

      .front-en {
        font-weight: bold;
        line-height: 1.1;
        margin-bottom: auto;
      }

      .back {
        line-height: 1.1;
        border-top: 1px solid #eee;
        padding-top: 1.5mm;
        margin-top: auto;
        color: var(--text-main);
      }

      /* Escalas de Texto Dinâmicas */
      .card.scale-xl .front-pt {
        font-size: 13pt;
      }
      .card.scale-xl .front-en {
        font-size: 18.5pt;
      }
      .card.scale-xl .back {
        font-size: 13.5pt;
      }

      .card.scale-lg .front-pt {
        font-size: 12pt;
      }
      .card.scale-lg .front-en {
        font-size: 17pt;
      }
      .card.scale-lg .back {
        font-size: 12.5pt;
      }

      .card.scale-md .front-pt {
        font-size: 11pt;
      }
      .card.scale-md .front-en {
        font-size: 15.5pt;
      }
      .card.scale-md .back {
        font-size: 11.5pt;
      }

      .card.scale-sm .front-pt {
        font-size: 10pt;
      }
      .card.scale-sm .front-en {
        font-size: 14pt;
      }
      .card.scale-sm .back {
        font-size: 10.5pt;
      }

      @media print {
        body {
          background: white;
        }
        .page {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>

          back: "A project I worked on did not achieve all its goals because we underestimated the complexity. I learned the importance of planning, communication, and identifying risks early.",

          front_en:

          back: "I first try to understand the problem, research the topic, and ask questions when necessary. I see it as an opportunity to learn something new.",
          difficulty: "Intermediate",

          back: "I try to stay flexible, understand the reason for the change, and adjust my priorities to meet the new requirements.",

          back: "We had a short deadline for a project, so I focused on the most important requirements, communicated with my team, and worked efficiently to deliver the project on time.",

        {

          front_en:

        {
          id: 42,
          front_pt:

          front_en:

          back: "I keep smiling, updating my skills, and preparing for the next automated opportunity.",
          difficulty: "Intermediate",
        },
        {
          id: 43,
          front_pt:
            "Como explicar que você foi reprovado pela inteligência artificial da Gupy?",
          front_en: "How do you explain that you were rejected by Gupy's AI?",
          back: "I just say the algorithm was looking for someone else, but my code and motivation remain top-notch.",

        {
          id: 44,
          front_pt:
            "Qual é a sua estratégia após receber o e-mail de que a decisão seguirá com outros candidatos?",

          back: "I take a deep breath, review my resume, enjoy a cup of coffee, and apply for the next challenge.",
          difficulty: "Hard",

          id: 45,
          front_pt:
            "Como manter o otimismo após dezenas de testes de fit cultural e testes técnicos longos?",

          back: "I treat every application as practice, learn from the process, and trust that the right door will open.",
          difficulty: "Hard",

      const app = document.getElementById("app");
      const cardsPerPage = 9;

      for (let i = 0; i < cards.length; i += cardsPerPage) {
        const pageCards = cards.slice(i, i + cardsPerPage);

        // --- CRIAÇÃO DA PÁGINA DE FRENTE ---
        const frontPage = document.createElement("div");
        frontPage.className = "page";

        pageCards.forEach((card) => {
          const element = document.createElement("div");
          const diffLower = card.difficulty.toLowerCase().trim();
          element.className = `card ${diffLower}`;

          const totalChars = (card.front_pt + card.front_en + card.back).length;
          if (totalChars < 140) element.classList.add("scale-xl");
          else if (totalChars < 210) element.classList.add("scale-lg");
          else if (totalChars < 300) element.classList.add("scale-md");
          else element.classList.add("scale-sm");

          element.innerHTML = `
            <div class="header">
                <span class="id-label">#${card.id}</span>
                <span class="difficulty badge-${diffLower}">${card.difficulty}</span>
            </div>
            <div class="front-pt">${card.front_pt}</div>
            <div class="front-en">${card.front_en}</div>
            <div class="back">${card.back}</div>
          `;
          frontPage.appendChild(element);
        });
        app.appendChild(frontPage);

        // --- CRIAÇÃO DA PÁGINA DE VERSO (ESPELHADA) ---
        const backPage = document.createElement("div");
        backPage.className = "page";

        let mirroredCards = [];
        for (let r = 0; r < 3; r++) {
          let row = pageCards.slice(r * 3, (r + 1) * 3);
          while (row.length < 3) row.push(null);
          mirroredCards.push(...row.reverse());
        }

        mirroredCards.forEach((card) => {
          const element = document.createElement("div");
          if (card) {
            element.className = "card card-back-side";
            element.innerHTML = `
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="100%" height="100%">
                <rect width="200" height="280" rx="15" fill="#0d1117" />

                <text x="100" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Gupy</text>
                <text x="100" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">gupy.io</text>

                <text x="100" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="900" fill="#3fb950" text-anchor="middle" letter-spacing="1">TRY AGAIN</text>
                <text x="100" y="232" font-family="Arial, sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">"Outros candidatos foram escolhidos"</text>
              </svg>
            `;
          } else {
            element.className = "card";
            element.style.visibility = "hidden";
          }
          backPage.appendChild(element);
        });
        app.appendChild(backPage);
      }
    </script>
  </body>
</html>
