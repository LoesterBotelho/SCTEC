<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Jogo da Velha</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin-top: 20px;
        }

        .casa {
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
        }

        .casa:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <h1>Jogo da Velha</h1>
    <div id="status">Vez do jogador: X</div>
    <div class="tabuleiro" id="tabuleiro"></div>
    <button onclick="reiniciar()">Reiniciar</button>

    <script>
        let jogadorAtual = 'X';
        let tabuleiro = ['', '', '', '', '', '', '', '', ''];
        let jogoAtivo = true;

        const divTabuleiro = document.getElementById('tabuleiro');

        // Renderiza o tabuleiro no DOM
        function renderizar() {
            divTabuleiro.innerHTML = '';
            tabuleiro.forEach((casa, index) => {
                const div = document.createElement('div');
                div.className = 'casa';
                div.innerText = casa;
                div.onclick = () => fazerJogada(index);
                divTabuleiro.appendChild(div);
            });
        }

        function fazerJogada(index) {
            if (tabuleiro[index] === '' && jogoAtivo) {
                tabuleiro[index] = jogadorAtual;
                verificarVencedor();
                jogadorAtual = jogadorAtual === 'X' ? 'O' : 'X';
                document.getElementById('status').innerText = `Vez do jogador: ${jogadorAtual}`;
                renderizar();
            }
        }

        function verificarVencedor() {
            const vitorias = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
                [0, 4, 8], [2, 4, 6]             // Diagonais
            ];

            for (let combo of vitorias) {
                const [a, b, c] = combo;
                if (tabuleiro[a] && tabuleiro[a] === tabuleiro[b] && tabuleiro[a] === tabuleiro[c]) {
                    jogoAtivo = false;
                    document.getElementById('status').innerText = `Jogador ${tabuleiro[a]} venceu!`;
                }
            }
        }

        function reiniciar() {
            tabuleiro = ['', '', '', '', '', '', '', '', ''];
            jogadorAtual = 'X';
            jogoAtivo = true;
            document.getElementById('status').innerText = 'Vez do jogador: X';
            renderizar();
        }

        renderizar();
    </script>

</body>

</html>
