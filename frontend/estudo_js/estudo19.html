<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Laboratório de Eventos JS</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            border: 2px solid #333;
            margin: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .active {
            background: #d1e7dd;
        }
    </style>
</head>

<body>

    <h1>Laboratório de Eventos</h1>

    <div id="mouseBox" class="box">Passe o mouse aqui</div>
    <button id="btnClick">Clique em mim</button>

    <input type="text" id="inputEvento" placeholder="Interaja comigo">

    <script>
        // --- EVENTOS DE MOUSE ---
        const mouseBox = document.getElementById('mouseBox');

        // click: Acionado quando um usuário clica em um elemento.
        document.getElementById('btnClick').addEventListener('click', () => alert('Clicado!'));

        // mouseover: Acionado quando o cursor do mouse entra na área de um elemento.
        mouseBox.addEventListener('mouseover', () => mouseBox.innerText = "Mouse aqui!");

        // mouseout: Acionado quando o cursor do mouse sai da área de um elemento.
        mouseBox.addEventListener('mouseout', () => mouseBox.innerText = "Mouse fora!");

        // mousedown: Acionado quando o botão do mouse é pressionado sobre um elemento.
        mouseBox.addEventListener('mousedown', () => mouseBox.style.borderColor = 'red');

        // mouseup: Acionado quando o botão do mouse é liberado sobre um elemento.
        mouseBox.addEventListener('mouseup', () => mouseBox.style.borderColor = 'green');

        // --- EVENTOS DE TECLADO E FOCO ---
        const input = document.getElementById('inputEvento');

        // focus: Acionado quando um elemento recebe foco.
        input.addEventListener('focus', () => input.style.backgroundColor = 'yellow');

        // blur: Acionado quando um elemento perde o foco.
        input.addEventListener('blur', () => input.style.backgroundColor = 'white');

        // keydown: Acionado quando uma tecla é pressionada.
        input.addEventListener('keydown', (e) => console.log('Tecla pressionada:', e.key));

        // keyup: Acionado quando uma tecla é liberada.
        input.addEventListener('keyup', (e) => console.log('Tecla liberada:', e.key));

        // change: Acionado quando o valor de um elemento é alterado e confirmado.
        input.addEventListener('change', () => alert('Valor alterado e confirmado!'));
    </script>
</body>

</html>
