<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Loester</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Loester</h1>
    </header>

    <main>

        <section id="formulario">
            <h2 id="titulo-form">Formulário</h2>

            <form aria-labelledby="titulo-form">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nomeCompleto">Nome completo</label>
                    <input type="text" id="nomeCompleto" name="nomeCompleto" required minlength="3"
                        aria-required="true">

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="contato@gmail.com" required
                        aria-required="true">

                    <label for="idade">Idade</label>
                    <input type="number" id="idade" name="idade" required min="18" max="80" aria-required="true">

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(47) 99888-8888"
                        pattern="\(\d{2}\)\s\d{5}-\d{4}" required aria-describedby="telHelp">

                    <small id="telHelp">Formato: (47) 99888-8888</small>

                </fieldset>

                <fieldset>
                    <legend>Informações profissionais</legend>

                    <label for="turno">Turno disponível</label>
                    <select id="turno" name="turno" required>
                        <option value="">Selecione</option>
                        <option value="1">Matutino</option>
                        <option value="2">Vespertino</option>
                        <option value="3">Noturno</option>
                        <option value="4">Diurno</option>
                        <option value="5">Integral</option>
                    </select>

                    <label for="materia">Matéria</label>
                    <select id="materia" name="materia" required>
                        <option value="">Selecione</option>
                        <option value="1">Matemática</option>
                        <option value="2">Português</option>
                        <option value="3">Biologia</option>
                        <option value="4">Ciências</option>
                        <option value="5">História</option>
                        <option value="6">Geografia</option>
                        <option value="7">Artes</option>
                    </select>

                    <label for="escolaridade">Escolaridade</label>
                    <select id="escolaridade" name="escolaridade" required>
                        <option value="">Selecione</option>
                        <option value="1">Ensino Superior Completo</option>
                        <option value="2">Cursando Mestrado</option>
                        <option value="3">Mestrado Completo</option>
                        <option value="4">Cursando Doutorado</option>
                        <option value="5">Doutorado Completo</option>
                    </select>

                </fieldset>

                <fieldset>
                    <legend>Descrição</legend>

                    <label for="descricaoSelf">Sobre você</label>
                    <textarea id="descricaoSelf" name="descricaoSelf" rows="5" required minlength="10"></textarea>

                </fieldset>

                <div class="checkbox-group">
                    <input type="checkbox" id="inscricao" name="inscricao">
                    <label for="inscricao">Receber newsletter</label>
                </div>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Loester</p>
    </footer>

</body>

</html>
