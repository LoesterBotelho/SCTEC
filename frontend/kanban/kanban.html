<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    Dark Kanban Board
  </title>

  <link rel="stylesheet" href="fakebootstrap.css">

  <link rel="stylesheet" href="kanban.css">

</head>

<body>

  <div class="container">

    <h1 class="text-center mb-3">
      Study Kanban Board
    </h1>

    <!-- ACTIONS -->

    <div class="actions mb-3">

      <button class="btn btn-success" id="exportButton">
        Export JSON
      </button>

      <button class="btn btn-warning" id="importButton">
        Import JSON
      </button>

      <button class="btn btn-danger" id="clearButton">
        Clear Dataset
      </button>

      <input type="file" id="fileInput" hidden accept=".json">

    </div>

    <!-- BOARD -->

    <div class="kanban-board">

      <!-- TODO -->

      <div class="kanban-column">

        <h2>
          Todo
        </h2>

        <div class="kanban-cards" id="todo"></div>

      </div>

      <!-- DOING -->

      <div class="kanban-column">

        <h2>
          Doing
        </h2>

        <div class="kanban-cards" id="doing"></div>

      </div>

      <!-- DONE -->

      <div class="kanban-column">

        <h2>
          Done
        </h2>

        <div class="kanban-cards" id="done"></div>

      </div>

    </div>

  </div>

  <!-- MODAL -->

  <div class="modal hidden" id="modal">

    <div class="modal-content">

      <button class="close-button" id="closeModal">
        ✖
      </button>

      <h2 class="mb-2">
        Edit Card
      </h2>

      <!-- TITLE -->

      <div class="form-group">

        <label>
          Title
        </label>

        <input type="text" id="editTitle">

      </div>

      <!-- CODE -->

      <div class="form-group">

        <label>
          Code
        </label>

        <input type="text" id="editCode">

      </div>

      <!-- HOURS -->

      <div class="form-group">

        <label>
          Hours
        </label>

        <input type="text" id="editHours">

      </div>

      <!-- POINTS -->

      <div class="form-group">

        <label>
          Points
        </label>

        <input type="number" id="editPoints">

      </div>

      <!-- DESCRIPTION -->

      <div class="form-group">

        <label>
          Description
        </label>

        <textarea id="editDescription"></textarea>

      </div>

      <!-- STATUS -->

      <div class="form-group">

        <label>
          Status
        </label>

        <select id="editStatus">

          <option value="todo">
            Todo
          </option>

          <option value="doing">
            Doing
          </option>

          <option value="done">
            Done
          </option>

        </select>

      </div>

      <!-- SAVE -->

      <button class="btn btn-success" id="saveCardButton">
        Save Card
      </button>

    </div>

  </div>

  <script src="kanban.js"></script>

</body>

</html>
