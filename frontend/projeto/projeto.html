<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projetos</title>
    <style>
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-main: #e0e0e0;
        --text-muted: #a0a0a0;
        --border-color: #333333;
        --primary-blue: #bb86fc;
        --table-hover: #2a2a2a;
      }

      [data-theme="light"] {
        --bg-color: #f4f4f9;
        --card-bg: #ffffff;
        --text-main: #333333;
        --text-muted: #666666;
        --border-color: #dddddd;
        --primary-blue: #6200ee;
        --table-hover: #f9f9f9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 24px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: var(--card-bg);
        border-radius: 12px;
        padding: 24px;
        overflow-x: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        background-color: var(--primary-blue);
        color: white;
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        color: var(--text-muted);
        font-size: 11px;
        text-transform: uppercase;
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
      }
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
        font-size: 14px;
      }
      tr:hover {
        background-color: var(--table-hover);
      }

      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        color: #fff;
        display: inline-block;
      }
      .bg-green {
        background-color: #00c875;
      }
      .bg-red {
        background-color: #e2445c;
      }
      .bg-orange {
        background-color: #fdab3d;
      }
      .bg-blue {
        background-color: #579bfc;
      }
      .bg-purple {
        background-color: #784bd1;
      }
      .bg-dark {
        background-color: #333;
      }

      .progress-bar-container {
        display: flex;
        height: 10px;
        border-radius: 6px;
        overflow: hidden;
        background: #444;
        width: 100px;
      }
      .progress-seg {
        height: 100%;
      }
      .timeline-bar {
        background-color: var(--primary-blue);
        height: 10px;
        border-radius: 6px;
        width: 60px;
      }
    </style>
  </head>
  <body data-theme="dark">
    <div class="container">
      <div class="header">
        <h1>Projetos</h1>
        <button onclick="toggleTheme()">Alternar Tema</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Projeto</th>
            <th>Resp.</th>
            <th>Saúde</th>
            <th>Progresso</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Cronograma</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Automação de suporte</td>
            <td>Equipe A</td>
            <td><span class="badge bg-green">Dentro do prazo</span></td>
            <td>
              <div class="progress-bar-container">
                <div class="progress-seg bg-green" style="width: 70%"></div>
              </div>
            </td>
            <td><span class="badge bg-blue">Baixa</span></td>
            <td><span class="badge bg-orange">Em andamento</span></td>
            <td><div class="timeline-bar"></div></td>
          </tr>
          <tr>
            <td>Fluxo de onboarding</td>
            <td>Equipe B</td>
            <td><span class="badge bg-red">Escalado</span></td>
            <td>
              <div class="progress-bar-container">
                <div class="progress-seg bg-red" style="width: 40%"></div>
              </div>
            </td>
            <td><span class="badge bg-dark">Crítica</span></td>
            <td><span class="badge bg-orange">Em andamento</span></td>
            <td><div class="timeline-bar"></div></td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      function toggleTheme() {
        const body = document.body;
        body.setAttribute(
          "data-theme",
          body.getAttribute("data-theme") === "dark" ? "light" : "dark",
        );
      }
    </script>
  </body>
</html>
