<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Eventos Acadêmicos</title>
    <style>
        /* Variáveis de Design - Paleta Premium Moderna */
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #334155;
            --text-dark: #0f172a;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        /* Reset Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Painel de Ferramentas / Importar e Exportar */
        .toolbar-panel {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: var(--shadow);
        }

        .toolbar-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .action-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        /* Topbar / Navegação do Calendário */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #ffffff;
            padding: 1.5rem 2rem;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: var(--shadow);
        }

        .calendar-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .nav-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* Estilo de Botão Padrão */
        .btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .btn-warning {
            background-color: var(--warning);
            border-color: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background-color: var(--warning-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        /* Ocultar input file nativo feio */
        #importFile {
            display: none;
        }

        /* Estrutura de Grade do Calendário */
        .calendar-body {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            border: 1px solid var(--border);
            border-top: none;
            box-shadow: var(--shadow);
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: var(--border);
            border: 1px solid var(--border);
            margin-top: 0.5rem;
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        /* Célula do Dia */
        .day-cell {
            background: var(--surface);
            min-height: 120px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .day-cell:hover {
            background-color: #f1f5f9;
        }

        .day-cell.empty {
            background-color: #f8fafc;
            cursor: default;
        }

        .day-cell.today {
            background-color: #eff6ff;
        }

        .day-cell.today .day-number {
            background: var(--accent);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-number {
            font-weight: 700;
            font-size: 0.875rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        /* Container de Eventos dentro do Dia */
        .events-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 85px;
        }

        .event-item {
            background-color: #e0f2fe;
            border-left: 3px solid var(--accent);
            color: #0369a1;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .events-container::-webkit-scrollbar {
            width: 3px;
        }

        .events-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Estrutura do Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--surface);
            width: 100%;
            max-width: 450px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            background: var(--primary);
            color: white;
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.375rem;
        }

        .form-control {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .modal-event-list {
            margin-top: 1rem;
            border-top: 1px dashed var(--border);
            padding-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .modal-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.815rem;
            padding: 0.5rem;
            background: #f1f5f9;
            border-radius: 6px;
            margin-bottom: 0.25rem;
        }

        .weekend {
            background-color: #fef9c3;
            text-align: center;
            font-weight: 600;
            width: 60px;
        }

        .sunday {
            background-color: #fee2e2;
            text-align: center;
            font-weight: 600;
            width: 60px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="toolbar-panel">
            <div class="toolbar-title">Sincronização de Dados de Eventos</div>
            <div class="action-group">
                <button class="btn btn-success" id="btnExport">💾 Salvar / Exportar JSON</button>
                <label for="importFile" class="btn btn-warning">📂 Importar JSON</label>
                <input type="file" id="importFile" accept=".json">
            </div>
        </div>

        <div class="calendar-header">
            <h1 id="monthYearDisplay">Maio de 2026</h1>
            <div class="nav-buttons">
                <button class="btn" id="btnPrev">Anterior</button>
                <button class="btn" id="btnToday">Hoje</button>
                <button class="btn" id="btnNext">Próximo</button>
            </div>
        </div>

        <div class="calendar-body">
            <div class="weekdays-grid">
                <div>Dom</div>
                <div>Seg</div>
                <div>Ter</div>
                <div>Qua</div>
                <div>Qui</div>
                <div>Sex</div>
                <div>Sáb</div>
            </div>
            <div class="days-grid" id="daysContainer"></div>
        </div>
    </div>

    <div class="modal-overlay" id="eventModal">
        <div class="modal-card">
            <div class="modal-header" id="modalTitle">Adicionar Evento</div>
            <div class="modal-body">
                <form id="eventForm">
                    <input type="hidden" id="selectedDate">
                    <div class="form-group">
                        <label for="eventTitle">Título do Evento</label>
                        <input type="text" id="eventTitle" class="form-control"
                            placeholder="Ex: Aula de Quarkus / Reunião" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Horário</label>
                        <input type="time" id="eventTime" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar Evento</button>
                </form>

                <div class="modal-event-list" id="modalEventList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn" style="color: var(--text-main);" id="btnCloseModal">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('calendar_events')) || {};

        const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        // Elementos DOM
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const daysContainer = document.getElementById('daysContainer');
        const eventModal = document.getElementById('eventModal');
        const eventForm = document.getElementById('eventForm');
        const selectedDateInput = document.getElementById('selectedDate');
        const eventTitleInput = document.getElementById('eventTitle');
        const eventTimeInput = document.getElementById('eventTime');
        const modalTitle = document.getElementById('modalTitle');
        const modalEventList = document.getElementById('modalEventList');

        // ==========================================
        // 💾 FUNÇÃO: SALVAR / EXPORTAR JSON COMPLETO
        // ==========================================
        document.getElementById('btnExport').addEventListener('click', function () {
            if (Object.keys(events).length === 0) {
                alert("Não existem eventos cadastrados para exportar.");
                return;
            }

            // Converte o objeto de eventos para uma string JSON formatada
            const jsonString = JSON.stringify(events, null, 2);

            // Cria um blob de dados em memória
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            // Cria um link oculto temporário para forçar o download
            const downloadLink = document.createElement('a');
            downloadLink.href = url;

            // Define o nome dinâmico baseado no mês/ano atual do sistema
            const mesAtual = months[currentDate.getMonth()].toLowerCase();
            const anoAtual = currentDate.getFullYear();
            downloadLink.download = `eventos_calendario_${mesAtual}_${anoAtual}.json`;

            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        });

        // ==========================================
        // 📂 FUNÇÃO: IMPORTAR E MESCLAR JSON
        // ==========================================
        document.getElementById('importFile').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const importedData = JSON.parse(event.target.result);

                    if (typeof importedData !== 'object' || importedData === null) {
                        throw new Error("Formato inválido.");
                    }

                    // Confirmação de segurança inteligente para mesclar dados
                    const bConfirm = confirm("Deseja mesclar os eventos importados com os seus eventos atuais? (Eventos na mesma data serão somados)");

                    if (bConfirm) {
                        // Lógica Mês a Mês: Percorre as chaves de data do arquivo importado
                        for (const dateKey in importedData) {
                            if (importedData.hasOwnProperty(dateKey)) {
                                if (!events[dateKey]) {
                                    events[dateKey] = [];
                                }
                                // Mescla os arrays evitando substituição bruta do mês inteiro
                                events[dateKey] = [...events[dateKey], ...importedData[dateKey]];
                            }
                        }

                        // Salva as alterações de volta no LocalStorage e atualiza a tela
                        localStorage.setItem('calendar_events', JSON.stringify(events));
                        renderCalendar();
                        alert("Eventos importados e sincronizados com sucesso!");
                    }

                } catch (err) {
                    alert("Erro ao ler o arquivo JSON. Certifique-se de que ele foi exportado por este sistema.");
                }
                // Limpa o input para permitir importar o mesmo arquivo novamente se necessário
                e.target.value = '';
            };
            reader.readAsText(file);
        });

        // Renderização Principal da Grade
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearDisplay.innerText = `${months[month]} de ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            daysContainer.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                daysContainer.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const today = new Date();
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();

                let dayEventsHTML = '';
                if (events[dateString]) {
                    const sortedEvents = [...events[dateString]].sort((a, b) => a.time.localeCompare(b.time));
                    sortedEvents.forEach((ev) => {
                        dayEventsHTML += `<div class="event-item" title="${ev.time} - ${ev.title}">${ev.time} - ${ev.title}</div>`;
                    });
                }

                const dayCell = document.createElement('div');
                dayCell.className = `day-cell ${isToday ? 'today' : ''}`;
                dayCell.innerHTML = `
                <div class="day-number">${day}</div>
                <div class="events-container">${dayEventsHTML}</div>
            `;

                dayCell.addEventListener('click', () => openModal(dateString, day, month, year));
                daysContainer.appendChild(dayCell);
            }
        }

        function openModal(dateString, day, month, year) {
            selectedDateInput.value = dateString;
            modalTitle.innerText = `Compromissos para ${day} de ${months[month]}`;
            eventTitleInput.value = '';
            eventTimeInput.value = '';
            updateModalEventList(dateString);
            eventModal.classList.add('active');
        }

        function closeModal() { eventModal.classList.remove('active'); }

        function updateModalEventList(dateString) {
            modalEventList.innerHTML = '';
            if (!events[dateString] || events[dateString].length === 0) {
                modalEventList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted)">Nenhum evento neste dia.</p>';
                return;
            }

            events[dateString].forEach((ev, index) => {
                const item = document.createElement('div');
                item.className = 'modal-list-item';
                item.innerHTML = `
                <span><strong>${ev.time}</strong> - ${ev.title}</span>
                <button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="deleteEvent('${dateString}', ${index})">Excluir</button>
            `;
                modalEventList.appendChild(item);
            });
        }

        eventForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const dateString = selectedDateInput.value;
            const newEvent = { title: eventTitleInput.value, time: eventTimeInput.value };

            if (!events[dateString]) events[dateString] = [];
            events[dateString].push(newEvent);

            localStorage.setItem('calendar_events', JSON.stringify(events));
            updateModalEventList(dateString);
            renderCalendar();
            eventTitleInput.value = '';
            eventTimeInput.value = '';
        });

        window.deleteEvent = function (dateString, index) {
            events[dateString].splice(index, 1);
            if (events[dateString].length === 0) delete events[dateString];
            localStorage.setItem('calendar_events', JSON.stringify(events));
            updateModalEventList(dateString);
            renderCalendar();
        };

        document.getElementById('btnPrev').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        document.getElementById('btnNext').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        document.getElementById('btnToday').addEventListener('click', () => { currentDate = new Date(); renderCalendar(); });
        document.getElementById('btnCloseModal').addEventListener('click', closeModal);
        eventModal.addEventListener('click', (e) => { if (e.target === eventModal) closeModal(); });

        renderCalendar();
    </script>
</body>

</html>
