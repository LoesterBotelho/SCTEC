<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Matemática</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 6px;
            font-size: 18px;
            text-align: center;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Calculadora</h1>

        <label for="valor1">Valor 1</label>
        <input type="number" id="valor1" placeholder="Digite o valor 1">

        <label for="valor2">Valor 2</label>
        <input type="number" id="valor2" placeholder="Digite o valor 2">

        <label for="operacao">Operação (+ - * / %)</label>
        <input type="text" id="operacao" placeholder="Digite a operação">

        <button onclick="calcular()">
            Efetuar Operação
        </button>

        <div class="resultado" id="resultado">
            Resultado aparecerá aqui
        </div>
    </div>

    <script>
        function calcular() {

            let valor1 = parseFloat(document.getElementById("valor1").value);
            let valor2 = parseFloat(document.getElementById("valor2").value);
            let operacao = document.getElementById("operacao").value;

            let resultado;

            switch (operacao) {

                case "+":
                    resultado = valor1 + valor2;
                    break;

                case "-":
                    resultado = valor1 - valor2;
                    break;

                case "*":
                    resultado = valor1 * valor2;
                    break;

                case "/":
                    if (valor2 === 0) {
                        resultado = "Não é possível dividir por zero";
                    } else {
                        resultado = valor1 / valor2;
                    }
                    break;

                case "%":
                    resultado = valor1 % valor2;
                    break;

                default:
                    resultado = "Operador inválido";
            }

            document.getElementById("resultado").innerHTML =
                "Resultado: " + resultado;
        }
    </script>

</body>

</html>
