<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCTEC - Processo Seletivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f3f3f3;
            color: #111;
        }

        /* HEADER e CONTAINER (Mantidos conforme seu projeto) */
        header {
            width: 100%;
            height: 82px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .logo {
            width: 145px;
        }

        .container {
            width: 100%;
            max-width: 1220px;
            margin: 25px auto;
            display: flex;
            gap: 20px;
            padding: 0 10px;
        }

        .content {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
        }

        /* TIMELINE CORRIGIDA */
        .timeline {
            display: flex;
            flex-direction: column;
            margin-left: 10px;
        }

        .timeline-wrapper {
            display: flex;
            gap: 20px;
        }

        .line-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20px;
        }

        /* Bolinha Azul */
        .dot-blue {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #004484;
            z-index: 2;
        }

        /* Linha Azul */
        .line-blue {
            width: 6px;
            height: 100px;
            background: #66AAEA;
        }

        /* Linha Cinza Final */
        .line-gray {
            width: 6px;
            height: 100px;
            background: #E5E7EB;
        }

        /* Bolinha Cinza */
        .dot-gray {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #A3A3A3;
            z-index: 2;
        }

        .content-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 60px;
        }

        .date {
            color: #888;
            font-size: 13px;
        }

        .title {
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <header>
        <img class="logo" src="https://cursos.sesisenai.org.br/images/shared/sctec-logo.svg" alt="Logo">
    </header>

    <main class="container">
        <section class="content">
            <div class="timeline">

                <div class="timeline-wrapper">
                    <div class="line-col">
                        <div class="dot-blue"></div>
                        <div class="line-blue"></div>
                    </div>
                    <div class="content-col">
                        <span class="date">28 FEV 2026 | 17:24</span>
                        <span class="title">Inscrição iniciada</span>
                    </div>
                </div>

                <div class="timeline-wrapper">
                    <div class="line-col">
                        <div class="dot-blue"></div>
                        <div class="line-blue"></div>
                    </div>
                    <div class="content-col">
                        <span class="date">28 FEV 2026 | 17:25</span>
                        <span class="title">Inscrição em andamento / dados pessoais</span>
                    </div>
                </div>

                <div class="timeline-wrapper">
                    <div class="line-col">
                        <div class="dot-blue"></div>
                        <div class="line-blue"></div>
                    </div>
                    <div class="content-col">
                        <span class="date">28 FEV 2026 | 17:39</span>
                        <span class="title">Inscrição em andamento / envio de documentos</span>
                    </div>
                </div>

                <div class="timeline-wrapper">
                    <div class="line-col">
                        <div class="dot-blue"></div>
                        <div class="line-gray"></div>
                        <div class="dot-gray"></div>
                    </div>
                    <div class="content-col">
                        <span class="date">28 FEV 2026 | 17:39</span>
                        <span class="title">Processo seletivo / apuração</span>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>

</html>
